name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint HTML
        run: pnpm run lint:html
      - name: Lint CSS
        run: pnpm run lint:css
      - name: Lint authored JavaScript
        run: pnpm run lint:js
      - name: Check staged Pages files and offline assets
        run: bash .github/scripts/stage-pages.sh "$RUNNER_TEMP/condor-pages"
      - name: Check generated and vendored JavaScript syntax
        run: |
          for file in scripts/*.min.js gpu-io.min.js three.min.js; do
            node --check "$file"
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Check internal links
        run: pnpm run check:links

  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        continue-on-error: true
      - name: Upload LHCI artifacts
        if: ${{ hashFiles('.lighthouseci/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: .lighthouseci/**
          include-hidden-files: true
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: CSP header sanity check
        run: node tools/ci/check_csp.js
      - name: Audit (high severity)
        run: pnpm audit --audit-level=high || true

  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Dependency Review (push)
        if: github.event_name == 'push'
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}